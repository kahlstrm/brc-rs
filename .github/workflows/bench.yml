name: Benchmark

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: Compare against base branch
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the PR builds with its rust-toolchain.toml, and a base without one builds with stable
      - run: rustup update stable && rustup default stable && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest
      - name: Build PR and base
        run: |
          cargo build --release
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          # built from inside its worktree, so that Cargo reads the base's own .cargo/config.toml
          (cd "$RUNNER_TEMP/base" && rustup toolchain install && cargo build --release --target-dir "$RUNNER_TEMP/base-target")
          echo "BASE_BIN=$RUNNER_TEMP/base-target/release/brc-rs" >> "$GITHUB_ENV"
      - name: Install hyperfine
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install hyperfine
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Identify the CPU
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "RUNNER_CPU=$model, $(nproc) vCPUs, $(lscpu | sed -n 's/^Thread(s) per core: *//p') threads per core" >> "$GITHUB_ENV"
      - name: Benchmark
        # one dataset at a time, deleting each before the next: both don't fit in the runner's page cache,
        # and runs that read the file from disk measure the disk instead of the program
        run: |
          identical=true
          for dataset in "measurements 1_000_000_000 413" "measurements-10k 200_000_000 10000"; do
            read -r data rows stations <<< "$dataset"
            cargo r --quiet --bin create_measurements --features=generate --release "$rows" "$data.txt" "$stations"
            "$BASE_BIN" "$data.txt" > "$data-base.out"
            ./target/release/brc-rs "$data.txt" > "$data-pr.out"
            # command substitution drops trailing newlines, so a base that ended its output with an extra
            # blank line still compares equal; every station value must match
            [ "$(cat "$data-base.out")" = "$(cat "$data-pr.out")" ] || identical=false
            hyperfine -N --output=null --warmup 1 --runs 10 \
              --metrics time_wall_clock,time_cpu,memory_peak_resident \
              --export-json "$data.json" \
              -n base "$BASE_BIN $data.txt" \
              -n PR "./target/release/brc-rs $data.txt"
            rm "$data.txt"
          done
          echo "IDENTICAL=$identical" >> "$GITHUB_ENV"
          .github/scripts/bench-comment.sh "$BASE_REF" "$identical" \
            "1B rows, 413 stations," measurements.json \
            "200M rows, 10,000 stations," measurements-10k.json > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bench-compare -->"))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
      - name: Fail if outputs differ
        if: env.IDENTICAL != 'true'
        run: |
          for data in measurements measurements-10k; do
            diff "$data-base.out" "$data-pr.out" | head -n 20 || true
          done
          exit 1
