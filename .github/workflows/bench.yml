name: Benchmark

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: Compare against base branch
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-stable
      - name: Build PR and base
        run: |
          cargo build --release
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          cargo build --release --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir "$RUNNER_TEMP/base-target"
          echo "BASE_BIN=$RUNNER_TEMP/base-target/release/brc-rs" >> "$GITHUB_ENV"
      - name: Create measurements
        run: cargo r --quiet --bin create_measurements --features=generate --release 1_000_000_000
      - name: Install hyperfine
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install hyperfine
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Compare outputs
        run: |
          "$BASE_BIN" measurements.txt > base.out
          ./target/release/brc-rs measurements.txt > pr.out
          if cmp -s base.out pr.out; then echo "IDENTICAL=true"; else echo "IDENTICAL=false"; fi >> "$GITHUB_ENV"
      - name: Benchmark
        run: |
          hyperfine -N --output=null --warmup 1 --runs 10 \
            --metrics time_wall_clock,time_cpu,memory_peak_resident \
            --export-json bench.json \
            -n base "$BASE_BIN measurements.txt" \
            -n PR "./target/release/brc-rs measurements.txt"
          .github/scripts/bench-comment.sh bench.json "$BASE_REF" "$IDENTICAL" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bench-compare -->"))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
      - name: Fail if outputs differ
        if: env.IDENTICAL != 'true'
        run: |
          diff base.out pr.out | head -n 20
          exit 1
