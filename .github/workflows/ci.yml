name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".gitignore"

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # builds are for the CPU of the runner, so a cache built on another CPU may hold binaries this one can't run
      - name: Identify the CPU for the build cache
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name: *//p')
          [ -n "$model" ] || model=$(sysctl -n machdep.cpu.brand_string)
          echo "CPU_MODEL=$(printf '%s' "$model" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_ENV"
          # runners of the same model may differ in the features their hypervisor exposes, which decide what
          # target-cpu=native compiles for
          echo "CPU_FEATURES=$(rustc --print cfg -C target-cpu=native | grep target_feature | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          shared-key: ${{ matrix.os }}-${{ env.CPU_MODEL }}-${{ env.CPU_FEATURES }}
      - run: cargo build --verbose
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --verbose --all-features
      - name: Create measurements
        run: cargo r --quiet --bin create_measurements --features=generate --release 1_000_000

  mojo:
    name: mojo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mojo from mojo/requirements.txt
        run: pip install --requirement mojo/requirements.txt
      - name: Build
        run: |
          mkdir -p target/mojo
          mojo build -I mojo -o target/mojo/brc mojo/main.mojo
          mojo build -I mojo -o target/mojo/test_brc mojo/test_brc.mojo
      - name: Test
        run: target/mojo/test_brc
      - name: Compare the output with the Rust version's on generated measurements
        run: |
          rustup toolchain install
          cargo r --quiet --bin create_measurements --features=generate --release 1_000_000 measurements.txt 10000
          cargo r --quiet --release measurements.txt > rust.out
          target/mojo/brc measurements.txt > mojo.out
          BRC_THREADS=1 target/mojo/brc measurements.txt > mojo-1.out
          cmp rust.out mojo.out
          cmp rust.out mojo-1.out
